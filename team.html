  <style>
    :root { --ink: #16202A; --ink-2: #3A4652; --muted: #6B7682; --line: #DDE2E0; --soft: #F1F4F2; --bg: #F6F5F1; --spruce: #1F4E46; --spruce-2: #2A6A5E; --deep: #102F2A; --gold: #E2BE76; --red: #A8432F; --red-tint: #FBEDEA; --green: #2D6F47; --green-tint: #E6F2EA; --amber: #8A5A12; --amber-tint: #FBF1DE; --font: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; min-height: 100%; }
    body { font: 16px/1.5 var(--font); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; padding-bottom: env(safe-area-inset-bottom); }

    p { margin: 0; }

    main { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 16px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
    .sub { color: var(--muted); font-size: 14.5px; }

    .btn:disabled { opacity: .6; cursor: default; }
    .btn.wide { width: 100%; }
    .link { background: none; border: 0; padding: 0; color: var(--spruce-2); font: 600 15px var(--font); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--soft); border-radius: 12px; padding: 4px; margin-bottom: 18px; }
    .seg button { border: 0; background: transparent; padding: 10px; border-radius: 9px; font: 600 15px var(--font); color: var(--muted); cursor: pointer; }
    .seg button[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(22,32,42,.08); }
    .msg { font-size: 14.5px; min-height: 20px; }
    .msg.err { color: var(--red); }
    .msg.ok { color: var(--green); }
    .hello h1 { font-size: 26px; }
    .co { display: flex; align-items: center; gap: 10px; margin-top: 4px; color: var(--ink-2); font-weight: 600; }
    .co .logo { width: 34px; height: 34px; border-radius: 8px; background: var(--soft) center / contain no-repeat; flex: none; }
    .clock { text-align: center; padding: 26px 20px; }
    .state { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; background: var(--soft); color: var(--muted); }
    .state.on { background: var(--green-tint); color: var(--green); }
    .state.on::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.6s infinite; }
    @keyframes pulse { 50% { opacity: .3; } }
    .timer { font-size: 54px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin: 14px 0 2px; }
    .since { color: var(--muted); }
    .punch { margin-top: 22px; width: 100%; min-height: 76px; border-radius: 20px; border: 0; font: 700 22px var(--font); color: #fff; background: var(--spruce); cursor: pointer; box-shadow: 0 12px 30px rgba(31,78,70,.28); transition: transform .1s; }
    .punch:active { transform: scale(.98); }
    .punch.out { background: var(--red); box-shadow: 0 12px 30px rgba(168,67,47,.25); }
    .punch:disabled { opacity: .6; }
    .clock select { margin-top: 18px; }
    .loc { font-size: 13px; color: var(--muted); margin-top: 12px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
    .stat span { font-size: 13px; color: var(--muted); font-weight: 600; }
    .stat b { display: block; font-size: 24px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .shifts { list-style: none; margin: 10px 0 0; padding: 0; display: grid; }
    .shifts li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
    .shifts li:first-child { border-top: 0; }
    .shifts .d { font-weight: 600; }
    .shifts .h { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .note { background: var(--amber-tint); color: var(--amber); border-radius: 14px; padding: 14px 16px; font-size: 15px; }
    .center { text-align: center; }
    .install { text-align: center; }
    .install .icon { width: 84px; height: 84px; border-radius: 20px; margin: 4px auto 14px; display: block; box-shadow: 0 10px 24px rgba(16,47,42,.25); }
    .install h1 { font-size: 24px; }
    .install .lead { color: var(--ink-2); margin: 8px 0 18px; }

    .steps li > span { flex: 1; min-width: 0; }

    .steps li::before { content: counter(s); flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--spruce); color: #fff; font-weight: 700; font-size: 14px; }
    .steps svg { width: 22px; height: 22px; vertical-align: -5px; color: #0A84FF; }

    @keyframes bob { 50% { translate: 0 6px; } }
    .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.25); z-index: 10; max-width: calc(100% - 32px); }
